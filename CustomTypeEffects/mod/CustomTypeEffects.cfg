# CustomTypeEffects config
# Types that must NEVER trigger custom <type>_type_additional_effect_ids.
# Comma or whitespace separated; repeated blocked_types lines are merged.
# Remove this key (or delete the file) to use the built-in defaults.
# teleport      : skill teleports the hero out of combat
# melee/ranged : already handled by vanilla triggers, avoid double firing
# move         : vanilla movement skill
blocked_types = teleport, melee, ranged, move
