# ScrollWheel.cfg - 给无原生滚轮的界面加滚轮（v10，已实机验收）
# 模板默认三个面板全关（安全模式）；实机按 README 逐界面验收后再开启。
# 注意：guild 键为兼容旧配置保留，恒不生效（工会明确不支持，见 docs/adr/0001）。
# 支持 # // ; 注释，key = value。首次启动生成，之后绝不覆盖本文件。

enabled = 1                    ; 总开关（关掉后连输入捕获 cave 都不装）

; 每面板独立开关；默认全部关闭（安全模式）。guild 恒不生效，见下。
provision = 0                  ; 出征补给 ProvisionSelect（layout 0x2B8DB10/0x2B8DB30）
guild = 0                      ; 【已废弃/恒不生效】工会明确不支持，见 docs/adr/0001
raid_inventory = 0             ; 地牢背包 Panel_Inventory（layout 0x2BE38A0）

; 默认状态：只装输入 cave + 校验，状态机以 DRY-RUN 待命，不写布局、不裁剪、不改渲染。
; RealmInventory/Comet/Roster/地图等已原生支持滚轮的界面 DLL 一律不介入。

step = 30.0                    ; 每格滚轮步长（默认 = 游戏原生 0xEE63DC = 30.0f）
smooth = 8.0                   ; current 平滑逼近系数
visible_rows = 5               ; 可见行数
row_height = 40.0              ; 行高（与 step/max/firstRow 同一单位）[推测]
columns = 7                    ; layout[0] 读不到时的回退列数 [推测]
invert = 0                     ; =1 反转滚轮方向
frame_ttl = 1                  ; 面板激活标记的帧 TTL
scroll_range = 400.0           ; 动态范围算不出来时的回退上限
auto_range = 1                 ; =1 按每帧格子数动态扩大可下拉范围（物品越多滚得越远）
max_range = 2000.0             ; 动态范围上限
clip_out_of_window = 1         ; v10 裁剪：面板 gate(r8) + param_5 行号；0 = 只平移不裁剪
rows_per_notch = 1             ; 【已废弃】整行量化已删除

; v9：自绘滚动条已彻底移除（饰品库等界面本来就有游戏原生滚动条）。
; DLL 不创建窗口、不画 UI，只负责滚轮滚动本身。

debug_sampling = 0             ; =1 输出 [SAMPLE] 采样日志（零副作用，仍转调原实现）
debug_log = 0                  ; =1 打开 DEBUG 级日志（含 [DRY-RUN]）

patch_native_step = 0          ; =1 才改 .rdata 0xEE63DC（只调速，不满足需求，默认关）
native_step = 30.0

; 每面板鼠标矩形 x,y,w,h（UI 1920x1080 坐标）。默认全屏放行 [推测]，
; 实机用 debug_sampling 核对后收紧到真实网格区域；写 0,0,0,0 也视为放行。
provision_rect = 0,0,1920,1080
guild_rect = 0,0,1920,1080
raid_inventory_rect = 0,0,1920,1080

; === v11 工会技能栏滚轮（实验性，与旧的恒不生效 guild 键无关）===
; 0 = 两个工会 cave 一个都不装，已验收的补给/背包行为字节级不变（一键回退）。
; 代码默认 / 本模板 / 用户实际 cfg 三处显式写值，杜绝隐式开关。
guild_scroll = 0               ; 工会滚轮总开关（实验性，默认关闭）
guild_step = 30.0              ; 每格滚轮步长
guild_cap = 2000.0             ; 可下拉范围上限
guild_visible_rows = 1         ; max 公式保留行数 R（=1 保证不滚不到底）
guild_row_height = 91.0        ; 行高回退；优先用运行时技能槽 Y 相邻差

; === v11.2 滚轮按面板激活门控（修「打开补给前滚轮导致预翻页」）===
; 1 = 只在补给/背包网格活跃时消费滚轮并写布局（默认，推荐）
; 0 = 回到 v10 原行为（任何界面滚轮都驱动补给状态机），一键回退
gate_wheel_by_panel = 1
