; DDShield configuration
; Place next to DDShield.dll.
;
; The defaults below were measured from an in-game screenshot at 1602x932:
; the shield bar then sits directly above the health bar, with the same
; left edge and width.  If your resolution/UI scale differs, adjust gap,
; xOffset, yOffset, widthScale or scaleMul.

[general]
enabled = 1
debugLog = 0

[bar]
show = 1
; Shield bar height in UI units (the game's health bar is 10).
height = 6
; Distance between the shield bar bottom and the health bar top.
gap = 2
; Fine offsets in framebuffer pixels (positive = right / down).
xOffset = 0
yOffset = 0
; Width multiplier if the shield bar does not match the health bar width.
widthScale = 1.0
; 0 = hide the bar when the shield is empty.
alwaysShow = 0
border = 1
; The game lays its UI out for 1920x1080 and letterboxes it into the window.
autoScale = 1
uiWidth = 1920
uiHeight = 1080
; Extra manual multiplier on top of autoScale.
scaleMul = 1.0
; 0 = letterbox (uniform scale + centering), 1 = stretch to fill (non 16:9).
stretch = 0
; Some UI layouts add health_bar_offset.x (usually 50) to the bar position.
; Darkest Dungeon already includes it in the position passed to the bar
; routine, so this stays 0.
useLayoutOffset = 0
; Hover tooltip with the current shield value (localized).
tooltip = 1

fillColor   = 0.30, 0.75, 1.00, 1.00
backColor   = 0.04, 0.08, 0.14, 0.85
borderColor = 0.75, 0.92, 1.00, 0.90

[shield]
defaultMax = 0
startFlat = 0
startHpRatio = 0.0
maxHpRatio = 0.0
mirrorHeal = 0.0
regenPerRound = 0
decayPerRound = 0
; ActorClass member offset of the class id string (usually 8).
classIdOffset = 8
; Read shield: from heroes/<class>/<class>.info.darkest.
; Class id comes from Hero+0x1320 (HeroClass pointer), id string at +8.
classShield = 1
; Actor action/animation enum used by the optional bar filter.
actionOffset = 0xAC8
; Only draw the shield bar while the action enum is one of these values
; (comma separated, e.g. "1,2,3"). Empty = always draw.
actionAllow =
; Keep drawing the bar for this many ms after the game last called the health
; bar draw. Lower it (e.g. 40) if the bar should vanish during animations where
; the game stops drawing the HP bar.
barHoldMs = 120
; Hide the overlay while a UI panel (hero sheet etc.) is open.
hideInPanels = 1
; Hide while the game shows the mouse cursor (probe; check the log first).
hideWhenCursor = 0
; Hide every bar while any actor is mid-animation (skill/dodge/hit). The game
; stops drawing the acting actor's bar, but keeps drawing the others, so this
; makes all of them disappear together.
hideActing = 1
; Only these action values count as "performing a skill" for hideActing.
actingValues = 7,9,12
